# Full local stack, no Traefik, no production domain.
#   docker compose -f docker-compose.local.yml up -d --build
# Open http://localhost:8088
name: pa-netbird-local
services:
  netbird-server:
    image: netbirdio/netbird-server:${NETBIRD_SERVER_TAG:-0.74.4}
    volumes:
      - ./local/config.yaml:/etc/netbird/config.yaml:ro
      - netbird_data:/var/lib/netbird
    ports:
      - "3478:3478/udp"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      args:
        NETBIRD_DASHBOARD_TAG: ${NETBIRD_DASHBOARD_TAG:-v2.90.3}
    image: pa-netbird-dashboard:local
    environment:
      NETBIRD_MGMT_API_ENDPOINT: http://localhost:8088
      AUTH_AUTHORITY: http://localhost:8088/oauth2
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_SUPPORTED_SCOPES: openid profile email groups
      USE_AUTH0: "false"
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      NGINX_SSL_PORT: "443"
      LETSENCRYPT_DOMAIN: none
      PA_BRAND_NAME: ${PA_BRAND_NAME:-PA Shield}
      PA_LOGO_SRC: /brand/logo.svg
    depends_on: [netbird-server]
    restart: unless-stopped

  reset:
    build: ./reset
    image: pa-netbird-reset:local
    env_file:
      - path: smtp.env
        required: false
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      PA_BRAND_NAME: ${PA_BRAND_NAME:-PA Shield}
      IDP_DB: /data/idp.db
      NETBIRD_API: http://netbird-server:80
      SETTINGS_PATH: /config/email-settings.json
    volumes:
      - netbird_data:/data
      - reset_config:/config
    depends_on: [netbird-server]
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: pa-shield/gateway:local
    ports:
      - "8088:80"
    depends_on: [dashboard, netbird-server, reset]
    restart: unless-stopped

volumes:
  netbird_data:
  reset_config:
