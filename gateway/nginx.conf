# PA Shield gateway: one address for the dashboard, the NetBird server, the
# branded login page and the reset service. TLS is terminated in front of this
# (your own proxy or load balancer); X-Forwarded-Proto is passed through.
map $http_x_forwarded_proto $pa_proto { default $http_x_forwarded_proto; "" http; }

server {
  listen 80 http2;
  location /api/ { proxy_pass http://netbird-server:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $pa_proto; }
  # Login page (drawn by the server): swap logo, icon, title and colours.
  location = /oauth2/theme/logo.png { alias /brand/logo.svg; types { } default_type image/svg+xml; }
  location = /oauth2/theme/favicon.ico { alias /brand/icon.png; types { } default_type image/png; add_header Cache-Control "no-cache"; }
  location = /oauth2/theme/login-bg.png { alias /brand/login-bg.png; }
  location /oauth2/ {
    proxy_pass http://netbird-server:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pa_proto;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '<title>NetBird</title>' '<title>PA Shield</title>';
    sub_filter '../../theme/favicon.ico' '/oauth2/theme/favicon.ico?v=shield';
    sub_filter '#f68330' '#fd9904';
    sub_filter '</form>' '<a class="pa-forgot" href="/reset/forgot">Forgot password?</a></form>';
    sub_filter '</body>' '<div class="pa-promo"><h2>Welcome Back</h2><p>Securely connect your devices, servers and teams on one private network. Sign in to pick up right where you left off.</p></div></body>';
    sub_filter '</head>' '<style>a.pa-forgot{display:block;margin-top:16px;text-align:center;color:#fd9904;font-size:14px;font-weight:500;text-decoration:none}a.pa-forgot:hover{color:#481057;text-decoration:underline}body{background:#fff;color:#1f2937}.nb-container{margin-left:50%;width:50%;max-width:none;padding:40px}body::before{content:"";position:fixed;left:0;top:0;bottom:0;width:50%;background:linear-gradient(to top,rgba(26,10,34,.85),rgba(26,10,34,.15) 50%,rgba(26,10,34,.5)),url(/oauth2/theme/login-bg.png) center/cover,#1a0a22}body::after{display:none}.nb-logo{position:fixed;left:40px;top:40px;width:200px;height:40px;margin:0;z-index:2;background:url(/oauth2/theme/logo.png) left center/contain no-repeat}.nb-logo::after{content:"SECURE PRIVATE NETWORKING, ONE PEER AT A TIME";position:absolute;left:0;top:46px;white-space:nowrap;color:#fd9904;font-size:11px;font-weight:600;letter-spacing:.18em;line-height:1.4}.pa-promo{position:fixed;left:40px;bottom:40px;width:calc(50% - 80px);max-width:448px;z-index:2;color:#fff}.pa-promo h2{margin:0 0 8px;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.025em;color:#fff}.pa-promo p{margin:0;font-size:18px;line-height:28px;color:rgba(255,255,255,.9)}.nb-logo svg{display:none}.nb-card{background:transparent;border:0;box-shadow:none;max-width:480px;padding:0}.nb-heading{color:#2d3a52;text-align:left;font-size:32px;font-weight:600}.nb-subheading{text-align:left;color:#6b7280}.nb-label{color:#374151;font-size:15px}.nb-input{background:#f9fafb;border:1px solid #6b7a90;color:#111827;height:48px;border-radius:8px}.nb-input::placeholder{color:#9ca3af}.nb-input:focus{border-color:#fd9904;background:#fff;box-shadow:0 0 0 3px rgba(253,153,4,.2)}.nb-btn{background:#fd9904;height:48px;color:#fff}.nb-btn:hover{background:#481057}@media(max-width:1279px){body::before,body::after,.pa-promo,.nb-logo::after{display:none}.nb-container{margin:0;width:100%}.nb-logo{position:static;width:240px;height:56px;margin-bottom:32px}}</style></head>';
  }
  location /reset/ { proxy_pass http://reset:8000; proxy_set_header Host $host; }
  location /ws-proxy/ { proxy_pass http://netbird-server:80; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location /relay { proxy_pass http://netbird-server:80; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location /signalexchange.SignalExchange/ { grpc_pass grpc://netbird-server:80; }
  location /management.ManagementService/ { grpc_pass grpc://netbird-server:80; }
  location / { proxy_pass http://dashboard:80; proxy_set_header Host $host; }
}
