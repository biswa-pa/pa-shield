# Builds the PA Shield images and publishes them to GitHub Container Registry:
#   ghcr.io/<owner>/pa-shield/dashboard   drop-in for netbirdio/dashboard
#   ghcr.io/<owner>/pa-shield/reset       password reset, invites, email settings
#   ghcr.io/<owner>/pa-shield/gateway     one address + branded login page
# Pushes to main publish :latest and :sha-<short>. A tag like v1.2.0 publishes :1.2.0 too.
name: publish-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dashboard, context: ., file: Dockerfile }
          - { name: reset,     context: ./reset, file: reset/Dockerfile }
          - { name: gateway,   context: ., file: gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: v
        run: |
          echo "dashboard_tag=$(grep -E '^NETBIRD_DASHBOARD_TAG=' .env.example | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.v.outputs.repo }}/pa-shield/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NETBIRD_DASHBOARD_TAG=${{ steps.v.outputs.dashboard_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
