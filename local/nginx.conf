# Single origin for local use: dashboard on /, server on the API paths.
server {
  listen 80 http2;
  location /api/ { proxy_pass http://netbird-server:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http; }
  # Login page (drawn by the server): swap logo, icon, title and colours.
  location = /oauth2/theme/logo.png { alias /brand/logo.svg; types { } default_type image/svg+xml; }
  location = /oauth2/theme/favicon.ico { alias /brand/icon.png; types { } default_type image/png; }
  location /oauth2/ {
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '<title>NetBird</title>' '<title>PA Netbird</title>';
    sub_filter '#f68330' '#f09f40';
    sub_filter '#e5722a' '#d67e1e';
    sub_filter '#18191d' '#0d1b37';
    sub_filter '#1b1f22' '#16284a';
    sub_filter 'rgba(63,68,75,' 'rgba(51,73,114,';
    sub_filter 'rgba(50,54,61,' 'rgba(51,73,114,'; proxy_pass http://netbird-server:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http; }
  location /ws-proxy/ { proxy_pass http://netbird-server:80; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location /relay { proxy_pass http://netbird-server:80; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location /signalexchange.SignalExchange/ { grpc_pass grpc://netbird-server:80; }
  location /management.ManagementService/ { grpc_pass grpc://netbird-server:80; }
  location / { proxy_pass http://dashboard:80; proxy_set_header Host $host; }
}
